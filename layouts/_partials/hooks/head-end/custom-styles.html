{{/* Site-specific CSS overrides.
     Files in this folder are executed as templates and injected at the end of
     <head> on every page. Only put .html files here — any other file (a
     .gitkeep, a README) is also executed as a template and crashes the build. */}}
<style>
  /* ── Homepage background ───────────────────────────────────────────────
     Soft radial washes that give the page depth without a background image.
     They used to sit on the hero alone, which left a hard edge where the
     Research section started. Now they live on a layer pinned to the
     viewport, so the wash covers every section and stays in place while the
     content scrolls over it. Scoped to the homepage (the only page with the
     bio block). Built from the theme's colour variables, so changing
     theme.colors.primary in params.yaml restyles it automatically. Raise the
     alpha values for more colour, lower them for a flatter page. */
  body:has(.resume-biography)::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      radial-gradient(58% 78% at 10% 12%, rgb(var(--hb-primary-500-rgb) / 0.14) 0%, transparent 62%),
      radial-gradient(52% 72% at 90% 8%,  rgb(var(--hb-secondary-500-rgb) / 0.13) 0%, transparent 64%),
      radial-gradient(68% 62% at 72% 98%, rgb(var(--hb-primary-400-rgb) / 0.10) 0%, transparent 66%),
      radial-gradient(48% 60% at 30% 92%, rgb(var(--hb-secondary-400-rgb) / 0.08) 0%, transparent 68%);
  }
  :where(.dark) body:has(.resume-biography)::before {
    background-image:
      radial-gradient(58% 78% at 10% 12%, rgb(var(--hb-primary-500-rgb) / 0.26) 0%, transparent 62%),
      radial-gradient(52% 72% at 90% 8%,  rgb(var(--hb-secondary-500-rgb) / 0.22) 0%, transparent 64%),
      radial-gradient(68% 62% at 72% 98%, rgb(var(--hb-primary-400-rgb) / 0.16) 0%, transparent 66%);
  }

  /* ── University emblems on the education cards ─────────────────────────
     The theme renders these at 24px inside a 48px circle — too small for a
     detailed seal to read. Matches the emblem circles (bg-white + ring-1)
     only, not the section-heading icons (bg-primary-100). */
  .flex-shrink-0.w-12.h-12.bg-white.ring-1.rounded-full {
    width: 4rem;
    height: 4rem;
  }
  .flex-shrink-0.w-12.h-12.bg-white.ring-1.rounded-full > svg {
    width: 3.25rem;
    height: 3.25rem;
  }

  /* ── About Me text ─────────────────────────────────────────────────────
     Justified so both edges of each paragraph line up. The `prose` wrapper
     caps lines at 65ch, which left the text narrower than the Education
     cards below; lifting the cap makes both span the same column. */
  .prose:has(> .bio-text) {
    max-width: none;
  }
  .bio-text p {
    text-align: justify;
  }

  /* ── Research areas (layouts/_partials/hbx/blocks/research-areas) ──────
     Same width as the About Me text: that column is 8 of the bio block's
     12 grid columns inside its 80rem container with 2rem gaps, i.e.
     (80 - 11*2) / 12 * 8 + 7*2 = 52.67rem. Narrower screens just fill the
     width available. */
  .research-areas {
    max-width: 52.67rem;
    margin: 0 auto;
    padding: 0 1.5rem;
  }
  .research-lead {
    max-width: 40rem;
    margin: 0 auto 2.5rem;
    text-align: center;
    font-size: 1.125rem;
    font-style: italic;
  }
  .research-cards {
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }
  .research-label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.15rem;
  }
  .research-body {
    max-width: none;
  }
  .research-body p {
    text-align: justify;
  }
</style>
