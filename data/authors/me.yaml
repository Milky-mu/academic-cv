# ═══════════════════════════════════════════════════════════════════════════
#  YOUR PROFILE — this one file drives your homepage bio, the education and
#  experience timelines, your social links, skills, languages, and awards.
#  Start here. Anything you leave blank or delete simply won't render.
# ═══════════════════════════════════════════════════════════════════════════
schema: hugoblox/author/v1
slug: me
is_owner: true

name:
  display: Muzi (Mia) Ouyang  # Shown as the big heading on the homepage
  given: Muzi
  family: Ouyang
  alternate: 欧阳木子           # Name in another script
  pronunciation: Mùzǐ Ōuyáng  # Same order as display; 欧阳 is a compound surname
  pronouns: ''                # e.g. she/her — leave empty to hide

# Letters after your name. You don't have the PhD yet, so this stays empty
# for now — uncomment it the day you defend.
postnominals: []
# postnominals:
#   - PhD

# A small emoji badge on your avatar. "" hides it.
# 🔍 reads as "looking" — a quiet signal while you're on the job market.
status:
  icon: "🔍"

# Your current title — appears directly under your name.
role: PhD Candidate

# ── AFFILIATION ───────────────────────────────────────────────────────────
# The institution you belong to *right now*, shown in grey under your role.
# Not your research topic and not your job title — just where you are.
# Convention is "Department, University" and a link to the department page.
# List more than one only if you genuinely hold two posts (e.g. a joint
# appointment or an affiliated institute).
affiliations:
  - name: Department of Chemistry, Tsinghua University
    url: https://www.chem.tsinghua.edu.cn/

# ── BIO ───────────────────────────────────────────────────────────────────
# 2-4 sentences. On the job market, say what you work on AND that you're
# looking — search committees and prospective PIs read this first.
bio: |
  I am Muzi Ouyang (欧阳木子), and I go by Mia. I am a PhD candidate in
  Chemistry at Tsinghua University, advised by Prof. ADVISOR NAME. My
  research is on YOUR TOPIC — ONE SENTENCE ON WHAT YOU FOUND OR BUILT.

  My background spans animal science, basic medicine and chemistry, so I
  work comfortably at the interface between them. (Rewrite or delete this
  line — but a deliberate framing of an interdisciplinary path reads as a
  strength, whereas leaving it unexplained invites the question.)

  **I expect to defend in June 2027 and am seeking postdoctoral
  positions starting in late 2027.** If my work overlaps with your group's,
  I'd be glad to hear from you — my CV is linked above.

# ── Links shown as icons under your bio ────────────────────────────────────
# Delete any line you don't use. Icon names come from the Hugo Blox icon set:
#   at-symbol, phone, brands/x, brands/github, brands/linkedin, brands/bluesky,
#   brands/mastodon, brands/youtube, academicons/google-scholar,
