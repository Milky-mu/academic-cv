# ── EXPERIENCE ────────────────────────────────────────────────────────────
# Newest first. Omit `end` for anything ongoing. `icon:` works here too.
# As a PhD student, this is where research assistantships, teaching posts,
# internships, and visiting positions go.
experience:
  - role: Doctoral Researcher
    org: Institute of Biopharmaceutical and Health Engineering (iBHE), Tsinghua SIGS
    start: 2023-09-01
    icon: custom/tsinghua
    summary: |
      Designing dual-target bioPROTACs and dissecting how tumours escape
      targeted degradation. Built a tumour-specific, DNA-encoded
      bioPROTAC co-degrading ERα and PI3K p85α that acts synergistically
      with tamoxifen in resistant breast cancer cells (CI < 0.4), and
      engineered a KRAS-targeting degrader on a TRIM21–RBCC scaffold —
      then traced a hypervariable-region mutation driving degradation
      escape, using 200-ns all-atom molecular dynamics of the
      farnesylated, membrane-embedded protein alongside cross-validated
      proteomic and ubiquitomic profiling.
  - role: Independent Computational Research
    org: Self-directed
    start: 2026-02-01
    summary: |
      Reproduced the CLAIRE de novo binder-design pipeline (Rosetta motif
      matching, ProteinMPNN, AlphaFold2 self-consistency) end-to-end for
      three small-molecule targets, building the compute environment from
      scratch and fixing a latent defect in the original codebase. Also
      extracted the computational recipe of Guo et al. (Science, 2025)
      from the primary literature and built a three-layer framework to
      test whether it generalises to KRAS.
  - role: Graduate Researcher
    org: Sun Yat-sen University
    start: 2020-09-01
    end: 2023-07-31
    icon: custom/sun-yat-sen
    summary: |
      Characterised the PGAM5–OGT interaction and its role in protein
      stability and tumour invasion; contributed to an NSFC project on
      P311 regulation of Periostin translation in pancreatic cancer
      metastasis (Grant 32000543); and built SARS-CoV-2 replicon deletion
      and mutation models, identifying nsp13-C16446T as an enhancer of
      the nsp12 interaction.

