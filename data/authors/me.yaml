    url: mailto:mumumia.1009@gmail.com
    label: E-mail (Gmail)
  - icon: at-symbol
    url: mailto:oymzmia@163.com
    label: E-mail (163)
  - icon: academicons/google-scholar
    url: "https://scholar.google.com/citations?user=qAezGtwAAAAJ&hl=en"
  - icon: academicons/orcid
    url: https://orcid.org/0000-0000-0000-0000
  - icon: brands/github
    url: https://github.com/Milky-mu
  - icon: brands/linkedin
    url: https://www.linkedin.com/in/muzi-ouyang/

# ── Research interests — a simple bulleted list on the homepage ────────────
interests:
  - First research interest
  - Second research interest
  - Third research interest

# ── EDUCATION ─────────────────────────────────────────────────────────────
# Newest first. Rendered as cards on the homepage and as a timeline on
# /experience/.
#
# `icon:` puts a university emblem in the circle, LinkedIn-style. To use one:
#   1. Save the university's logo as SVG in `assets/media/icons/custom/`
#      e.g. assets/media/icons/custom/tsinghua.svg
#   2. Reference it here as `icon: custom/tsinghua`
# See `assets/media/icons/custom/README.md` for details and caveats.
# Omit `icon:` and you get the default graduation-cap.
#
# IMPORTANT: a `custom/...` icon whose SVG is missing renders the Hugo logo,
# not the fallback cap. Add the file first, then uncomment the line.
#
# Dates: use `year:` for a free-text line on the card ("2022 – present").
# Also keep `start:`/`end:` — the /experience/ timeline uses those, and
# omitting `end` makes it show "Present".
education:
  - degree: PhD in Chemistry
    institution: Tsinghua University
    year: "Sep 2023 – Jun 2027 (expected)"
    start: 2023-09-01
    # end: omitted on purpose — renders as "Present" until you defend
    icon: custom/tsinghua
    summary: |
      Thesis: *YOUR THESIS TITLE*. Advised by Prof. ADVISOR NAME.
  - degree: Master's Degree in Basic Medicine
    institution: Sun Yat-sen University
    year: "Sep 2020 – Jul 2023"
    start: 2020-09-01
    end: 2023-07-31
    icon: custom/sun-yat-sen
  - degree: Bachelor's Degree in Animal Sciences
    institution: Northwest A&F University
    year: "Sep 2016 – Jul 2020"
    start: 2016-09-01
    end: 2020-07-31
    icon: custom/northwest-af

# ── EXPERIENCE ────────────────────────────────────────────────────────────
# Newest first. Omit `end` for anything ongoing. `icon:` works here too.
# As a PhD student, this is where research assistantships, teaching posts,
# internships, and visiting positions go.
experience:
  - role: Doctoral Researcher
    org: Department of Chemistry, Tsinghua University
    start: 2023-09-01
    icon: custom/tsinghua
    summary: |
      What you actually do: the methods you run, the systems you built, the
      results you got. Two or three sentences beats a bullet list here.
  - role: Research Intern
    org: Company or Institute
    start: 2024-06-01
    end: 2024-09-30
    summary: |
      What the internship covered and what came out of it.
  - role: Teaching Assistant
    org: Your Department
    start: 2023-01-01
    end: 2023-06-30
    summary: |
      Course name and level, and what you were responsible for.

# ── Skills — shown on /experience/. `level` is 1-5. ───────────────────────
skills:
  - name: Technical
    items:
      - label: Python
        level: 5
      - label: Add your own
        level: 4
  - name: Research
    items:
      - label: Academic Writing
        level: 4
      - label: Experimental Design
        level: 4

languages:
  - name: English
    level: 4
    label: Fluent

# ── Awards, honours, fellowships, scholarships ────────────────────────────
# On the postdoc market these carry real weight — list scholarships and
# travel grants too, not just paper awards. Delete the block if empty.
awards:
  - title: Your Scholarship, Fellowship or Award
    awarder: Awarding Body
    date: "2024-01-01"
    summary: One line on what it was for.
    icon: hero/trophy
